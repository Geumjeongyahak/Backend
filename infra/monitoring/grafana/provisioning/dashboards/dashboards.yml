apiVersion: 1

providers:
  - name: portfolio
    orgId: 1
    folder: "portfolio"
    type: file
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboard-json/portfolio

  - name: homelab
    orgId: 1
    folder: "homelab"
    type: file
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboard-json/homelab
