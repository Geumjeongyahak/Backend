<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('사용자 상세')}"></head>
<body><div th:replace="~{admin/fragments/layout :: shell(~{::main})}">
<main class="stack">
    <div class="page-title">
        <div><h1 th:text="${user.name}">사용자</h1><p>사용자 상세 정보와 권한을 관리합니다.</p></div>
        <a class="button secondary" th:href="@{/admin/user/users/{userId}/edit(userId=${user.id})}">수정</a>
    </div>
    <section class="panel detail-grid">
        <div class="detail-item"><span>ID</span><strong th:text="${user.id}">1</strong></div>
        <div class="detail-item"><span>역할</span><strong th:text="${user.role}">VOLUNTEER</strong></div>
        <div class="detail-item"><span>이메일</span><strong th:text="${user.email}">email</strong></div>
        <div class="detail-item"><span>연락처</span><strong th:text="${user.phoneNumber ?: '-'}">-</strong></div>
        <div class="detail-item"><span>생년월일</span><strong th:text="${user.birthDate ?: '-'}">-</strong></div>
        <div class="detail-item"><span>업무분장</span><strong><a class="link" th:if="${user.workAssignment != null && user.workAssignment.type.name() == 'DEPARTMENT'}" th:href="@{/admin/department/departments/{departmentId}(departmentId=${user.workAssignment.departmentId})}" th:text="${user.workAssignment.name}">부서</a><span th:if="${user.workAssignment != null && user.workAssignment.type.name() == 'HOMEROOM'}">담임 · <a class="link" th:href="@{/admin/classroom/classrooms/{classroomId}(classroomId=${user.workAssignment.classroomId})}" th:text="${user.workAssignment.classroomName}">분반</a></span><span th:if="${user.workAssignment == null}">-</span></strong></div>
        <div class="detail-item"><span>대표 분반</span><strong><a class="link" th:if="${user.classroomId != null}" th:href="@{/admin/classroom/classrooms/{classroomId}(classroomId=${user.classroomId})}" th:text="${user.classroomName}">분반</a><span th:if="${user.classroomId == null}">-</span></strong></div>
    </section>
    <section class="panel stack">
        <h2>업무분장 및 대표 분반 변경</h2>
        <div class="inline-form">
            <form class="inline-form" th:action="@{/admin/user/users/{userId}/department(userId=${user.id})}" method="post">
                <select name="departmentId" required>
                    <option value="">부서 선택</option>
                    <option th:each="department : ${departments}" th:value="${department.id}" th:text="${department.name}" th:selected="${user.departmentId == department.id}">부서</option>
                </select>
                <button class="button secondary" type="submit">부서 변경</button>
            </form>
            <form class="inline-form" th:action="@{/admin/user/users/{userId}/homeroom(userId=${user.id})}" method="post">
                <select name="classroomId" required>
                    <option value="">담임 분반 선택</option>
                    <option th:each="classroom : ${classrooms}" th:value="${classroom.id}" th:text="${classroom.name}" th:selected="${user.workAssignment != null && user.workAssignment.type.name() == 'HOMEROOM' && user.workAssignment.classroomId == classroom.id}">분반</option>
                </select>
                <button class="button secondary" type="submit">담임 지정</button>
            </form>
            <form class="inline-form" th:if="${user.workAssignment != null && user.workAssignment.type.name() == 'HOMEROOM'}" th:action="@{/admin/user/users/{userId}/homeroom/release(userId=${user.id})}" method="post">
                <button class="button secondary" type="submit">담임 해제</button>
            </form>
            <form class="inline-form" th:action="@{/admin/user/users/{userId}/classroom(userId=${user.id})}" method="post">
                <select name="classroomId" required>
                    <option value="">대표 분반 선택</option>
                    <option th:each="classroom : ${classrooms}" th:value="${classroom.id}" th:text="${classroom.name}" th:selected="${user.classroomId == classroom.id}">분반</option>
                </select>
                <button class="button secondary" type="submit">대표 분반 변경</button>
            </form>
        </div>
    </section>
    <section class="panel stack">
        <h2>권한</h2>
        <div><span class="tag" th:each="permission : ${user.permissions}" th:text="|${permission.source}: ${permission.code}|">user:manage:*</span><span th:if="${#lists.isEmpty(user.permissions)}">-</span></div>
        <form class="inline-form permission-form" th:action="@{/admin/user/users/{userId}/permissions(userId=${user.id})}" method="post">
            <select name="permissionKey" required>
                <option value="">권한 선택</option>
                <option th:each="permission : ${permissionOptions}"
                        th:value="|${permission.resourceCode}:${permission.actionCode}|"
                        th:attr="data-resource-code=${permission.resourceCode},data-global-allowed=${permission.globalAllowed},data-target-allowed=${permission.targetAllowed}"
                        th:text="|${permission.label} (${permission.resourceCode}:${permission.actionCode})|">권한</option>
            </select>
            <select name="scopeTarget" required>
                <option value="">범위 선택</option>
                <option th:each="scope : ${permissionScopeOptions}"
                        th:value="${scope.value}"
                        th:attr="data-resource-code=${scope.resourceCode}"
                        th:text="${scope.label}">범위</option>
            </select>
            <button class="button" type="submit">권한 추가</button>
        </form>
    </section>
</main>
</div></body></html>
