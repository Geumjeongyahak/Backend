server:
  forward-headers-strategy: native

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?${POSTGRES_OPTIONS:}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 락을 이 시간(ms) 안에 못 얻으면 409 BIZ005 로 답한다. 0 이면 제한 없이 기다린다.
      connection-init-sql: SET lock_timeout = ${DB_LOCK_TIMEOUT_MS:3000}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:/sql/init_scheme.sql
      data-locations: classpath:/sql/init_data.sql
      continue-on-error: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  cloud:
    gcp:
      storage:
        bucket: ${GCP_DEV_BUCKET_NAME}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  server:
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  prometheus:
    metrics:
      export:
        enabled: true
