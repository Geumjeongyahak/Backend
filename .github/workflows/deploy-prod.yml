name: Deploy to Prod (SSH)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 배포와 되돌리기(rollback.yml)가 겹치지 않게 한다. 진행 중인 것을 끊지 않는다
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Test and build Spring Boot jar
        run: ./gradlew test bootJar

      - name: Deploy jar over SSH
        env:
          SSH_HOST: ${{ secrets.PROD_GCE_HOST }}
          SSH_USER: ${{ secrets.PROD_GCE_USER }}
          SSH_KEY: ${{ secrets.PROD_GCE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_HOST}"
          test -n "${SSH_USER}"
          test -n "${SSH_KEY}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          APP_JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | sort | tail -n 1)"
          if [[ -z "${APP_JAR}" ]]; then
            echo "app jar not found under build/libs" >&2
            exit 1
          fi

          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" "mkdir -p ~/app-dev/releases"
          # 커밋마다 jar 를 남긴다 (releases/<sha>.jar). 되돌리기는 rollback.yml 에 옛 SHA 를 넣는다
          scp -i ~/.ssh/deploy_key "${APP_JAR}" "${SSH_USER}@${SSH_HOST}:~/app-dev/releases/${GITHUB_SHA}.jar"
          scp -i ~/.ssh/deploy_key scripts/gcp/05_app/01_install-app-service.sh scripts/gcp/05_app/02_switch-release.sh \
            "${SSH_USER}@${SSH_HOST}:~/app-dev/"
          scp -r -i ~/.ssh/deploy_key scripts/gcp/05_app/grafana \
            "${SSH_USER}@${SSH_HOST}:~/app-dev/"
          # 전환 뒤 헬스 체크가 실패하면 스크립트가 이전 릴리스로 되돌리고 이 단계를 실패시킨다
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            "cd ~/app-dev && test -f .env && chmod +x 01_install-app-service.sh 02_switch-release.sh && ./02_switch-release.sh ${GITHUB_SHA}"

      - name: Verify prod health
        env:
          SSH_HOST: ${{ secrets.PROD_GCE_HOST }}
          SSH_USER: ${{ secrets.PROD_GCE_USER }}
          SSH_KEY: ${{ secrets.PROD_GCE_SSH_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            "curl -fsS http://127.0.0.1:9090/actuator/health >/dev/null && sudo systemctl is-active --quiet gjlearn-app"
